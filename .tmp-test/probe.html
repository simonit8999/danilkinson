<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>carousel probe</title>
    <style>
      body { margin: 0; font: 12px monospace; background: #fff; }
      #out { padding: 8px; white-space: pre-wrap; }
      iframe { width: 390px; height: 844px; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <pre id="out">pending
</pre>
    <iframe id="f" src="/#/item/ua-mwxhdude"></iframe>
    <script>
      const out = document.getElementById('out');
      const frame = document.getElementById('f');
      const log = (text) => {
        out.textContent += text + '\n';
      };
      const rect = (el) => {
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) };
      };

      const probe = (doc, tag) => {
        const win = doc.defaultView;
        const cs = (el) => (el ? win.getComputedStyle(el) : null);
        const fig = doc.querySelector('.detail-photo');
        const vp = doc.querySelector('.detail-carousel-viewport');
        const track = doc.querySelector('.detail-carousel-track');
        const slides = [...doc.querySelectorAll('.detail-carousel-slide')];
        const arrows = [...doc.querySelectorAll('.detail-carousel-arrow')];
        const dots = [...doc.querySelectorAll('.detail-carousel-dot')];

        log(`=== ${tag} ===`);
        log(`viewport ${win.innerWidth} docScrollWidth ${doc.documentElement.scrollWidth}`);
        log(`fig ${JSON.stringify(rect(fig))} ar=${cs(fig) && cs(fig).aspectRatio} radius=${cs(fig) && cs(fig).borderRadius} ratioVar=${fig.style.getPropertyValue('--photo-ratio')}`);
        log(`vp overflow-x=${cs(vp) && cs(vp).overflowX} snap=${cs(vp) && cs(vp).scrollSnapType} ta=${cs(vp) && cs(vp).touchAction}`);
        log(`vp scrollLeft=${vp.scrollLeft} clientWidth=${vp.clientWidth} scrollWidth=${vp.scrollWidth}`);
        log(`track display=${cs(track) && cs(track).display} w=${cs(track) && cs(track).width}`);
        log(`slides ${JSON.stringify(slides.map((s) => ({ r: rect(s), flex: cs(s).flex, snap: cs(s).scrollSnapAlign })))}`);
        log(`arrows ${JSON.stringify(arrows.map((a) => ({ r: rect(a), bg: cs(a).backgroundColor, z: cs(a).zIndex })))}`);
        log(`dots n=${dots.length} active=${dots.findIndex((d) => d.classList.contains('active'))}`);
        log(`aria ${fig.getAttribute('aria-label')}`);
      };

      const waitFor = (doc, check, timeout = 8000) => new Promise((resolve) => {
        const started = Date.now();
        const tick = () => {
          let ok = false;
          try {
            ok = check(doc);
          } catch (error) {
            ok = false;
          }
          if (ok || Date.now() - started > timeout) resolve(ok);
          else setTimeout(tick, 100);
        };
        tick();
      });

      frame.addEventListener('load', async () => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;

        const ready = await waitFor(doc, (d) => d.querySelectorAll('.detail-carousel-slide').length > 0);
        log(`ready=${ready}`);
        if (!ready) return;

        await new Promise((r) => setTimeout(r, 900));
        probe(doc, 'BEFORE');

        const vp = doc.querySelector('.detail-carousel-viewport');
        // В headless-virtual-time плавная прокрутка не проигрывается,
        // поэтому для проверки логики форсируем мгновенный скролл.
        const original = vp.scrollTo.bind(vp);
        vp.scrollTo = (options) => original({ ...(options || {}), behavior: 'auto' });

        doc.querySelector('.detail-carousel-arrow-next')
          .dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true }));
        await new Promise((r) => setTimeout(r, 400));
        vp.dispatchEvent(new win.Event('scroll'));
        await new Promise((r) => setTimeout(r, 400));
        probe(doc, 'AFTER ARROW CLICK');

        // Свайп влево на один слайд (то, что делает палец) + событие прокрутки.
        vp.scrollLeft = vp.clientWidth * 3;
        vp.dispatchEvent(new win.Event('scroll'));
        await new Promise((r) => setTimeout(r, 500));
        probe(doc, 'AFTER SWIPE (photo 3)');

        // Назад через край: клон последнего кадра слева — фото 4.
        vp.scrollLeft = 0;
        vp.dispatchEvent(new win.Event('scroll'));
        await new Promise((r) => setTimeout(r, 500));
        probe(doc, 'AFTER WRAP TO LAST');

        // Вперёд через край: клон первого кадра — снова фото 1.
        vp.scrollLeft = vp.scrollWidth;
        vp.dispatchEvent(new win.Event('scroll'));
        await new Promise((r) => setTimeout(r, 500));
        probe(doc, 'AFTER WRAP TO FIRST');
      });
    </script>
  </body>
</html>
