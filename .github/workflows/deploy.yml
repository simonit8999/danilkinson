name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check API base
        # VITE_API_URL (если задан) главнее адреса по умолчанию.
        # Без него Pages берёт постоянный домен туннеля из src/config.ts
        # (DEFAULT_PUBLIC_API), поэтому правки админки видны и на Pages.
        run: |
          echo "VITE_API_URL:        ${VITE_API_URL:-<not set: src/config.ts default used>}"
          echo "VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-<not set: src/config.ts default used>}"
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_API_URL: ${{ vars.VITE_PUBLIC_API_URL }}

      - name: Typecheck and build
        # Админка на GitHub Pages должна знать адрес локального сервера (туннель ngrok).
        # Settings -> Secrets and variables -> Actions -> Variables:
        #   VITE_API_URL = https://<домен>.ngrok-free.dev   (без слэша в конце)
        # Если переменная не задана, сборка использует DEFAULT_PUBLIC_API
        # из src/config.ts — тот же домен туннеля.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_API_URL: ${{ vars.VITE_PUBLIC_API_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
