name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check API base
        # Без VITE_API_URL Pages показывает статический каталог и не видит
        # правки локального сервера. Это предупреждение, а не ошибка:
        # сайт должен оставаться рабочим и в офлайн-режиме.
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::warning title=VITE_API_URL is not set::GitHub Pages will serve public/data/products.json. Admin changes on the local server will not reach buyers. Add the repository variable VITE_API_URL (see README)."
          else
            echo "API base: ${{ vars.VITE_API_URL }}"
          fi

      - name: Typecheck and build
        # Админка на GitHub Pages должна знать адрес локального сервера (туннель ngrok).
        # Settings -> Secrets and variables -> Actions -> Variables:
        #   VITE_API_URL = https://<домен>.ngrok-free.dev   (без слэша в конце)
        # Если переменная не задана, сайт работает от того же origin и API на Pages нет.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
